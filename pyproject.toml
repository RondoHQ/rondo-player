[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rondo-player"
version = "0.1.0"
description = "Subscription-free Raspberry Pi narrowcasting player for Rondo Club"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Rondo" }]
dependencies = []

[project.scripts]
rondo-player = "rondo_player.__main__:main"

[tool.setuptools.packages.find]
include = ["rondo_player*"]
